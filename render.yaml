services:
  - type: web
    name: mermacero
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: MONGODB_DB
        value: mermacero
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
